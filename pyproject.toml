[project]
name = "durable-tool-runtime"
version = "0.1.0"
description = "Crash-recoverable execution infrastructure for trusted async agent tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "acceptance: Phase 3 contract checks; excludes process-kill chaos and benchmarks",
    "chaos: POSIX subprocess tests that kill and reap only their own child processes",
]
filterwarnings = ["error"]
